<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://linkedin.com/in/ranithsarkar">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #3b0764 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #082f49 0%, transparent 35%),
                #050505;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: linear-gradient(135deg,
                    #8b5cf6,
                    #06b6d4);
            box-shadow:
                0 0 30px rgba(139, 92, 246, 0.35),
                0 0 70px rgba(6, 182, 212, 0.15);

            animation: float 2s ease-in-out infinite;
        }

        .logo span {
            font-size: 34px;
            font-weight: 800;
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        p {
            color: #a1a1aa;
            font-size: 16px;
            margin-bottom: 28px;
        }

        .loader {
            width: 45px;
            height: 45px;
            margin: auto;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #8b5cf6;
            border-right-color: #06b6d4;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;

            background: linear-gradient(135deg,
                    #8b5cf6,
                    #06b6d4);
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
        }

        .glow.one {
            top: -150px;
            left: -150px;
        }

        .glow.two {
            bottom: -150px;
            right: -150px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .logo {
                width: 70px;
                height: 70px;
                border-radius: 20px;
            }

            .logo span {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="glow one"></div>
    <div class="glow two"></div>
    <main class="container">
        <div class="logo">
            <span>↗</span>
        </div>
        <h1>Opening Linkedin...</h1>
        <p>Please wait while we redirect you.</p>
        <div class="loader"></div>
    </main>
</body>

</html>
